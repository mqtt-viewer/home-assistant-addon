# Home Assistant add-on manifest for MQTT Viewer.
#
# version must match a published tag of ghcr.io/mqtt-viewer/mqtt-viewer;
# Supervisor builds the small wrapper from that tag. Bump it when a new image ships.
name: MQTT Viewer
version: "1.2.0"
slug: mqtt_viewer
description: A fast MQTT visualisation and debugging tool, served to your browser
url: https://github.com/mqtt-viewer/mqtt-viewer
arch:
  - amd64
  - aarch64
init: false
map:
  - type: app_config
ports:
  8080/tcp: null
ports_description:
  8080/tcp: Direct Web UI
panel_icon: mdi:lan
panel_title: MQTT Viewer
environment:
  MQTT_VIEWER_DATA_DIR: /data
  MQTT_VIEWER_INSTALL_TYPE: home-assistant
ingress: true
ingress_port: 8080
ingress_stream: true
