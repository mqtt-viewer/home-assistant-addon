# Home Assistant add-on manifest for MQTT Viewer.
#
# version must match a published tag of ghcr.io/mqtt-viewer/mqtt-viewer;
# Home Assistant pulls <image>:<version>. Bump it when a new image ships.
name: MQTT Viewer
version: "1.3.0"
slug: mqtt_viewer
description: A fast MQTT visualisation and debugging tool, served to your browser
url: https://github.com/mqtt-viewer/mqtt-viewer
arch:
  - amd64
  - aarch64
image: ghcr.io/mqtt-viewer/mqtt-viewer
init: false
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Web UI
webui: http://[HOST]:[PORT:8080]
panel_icon: mdi:lan
panel_title: MQTT Viewer
environment:
  MQTT_VIEWER_DATA_DIR: /data
# Ingress (the UI inside the Home Assistant sidebar behind HA's own auth) is
# not supported yet: the app calls its backend at origin-absolute paths, which
# breaks under an ingress path prefix. Tracked in
# https://github.com/mqtt-viewer/mqtt-viewer/issues/119.
ingress: false
